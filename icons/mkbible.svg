  <path d="M146 136 C160 130 178 128 196 132" stroke="#c0392b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M60 152 C78 148 96 150 110 156" stroke="#9aa6d6" stroke-width="6" stroke-linecap="round" fill="none"/>
